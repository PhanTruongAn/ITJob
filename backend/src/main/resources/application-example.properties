spring.application.name=backend

# Database: local development keeps schema update behavior; deployments can set
# JPA_DDL_AUTO=validate after provisioning the schema.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/itjob}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.data.web.pageable.one-indexed-parameters=true

# JWT signing secret is required; validity values are non-secret settings.
jwt.base64-secret=${JWT_BASE64_SECRET}
jwt.access-token-validity-in-seconds=${JWT_ACCESS_TOKEN_VALIDITY_IN_SECONDS:86400}
jwt.refresh-token-validity-in-seconds=${JWT_REFRESH_TOKEN_VALIDITY_IN_SECONDS:604800}

# Cloudinary credentials are required by CloudinaryConfig.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.upload-preset=${CLOUDINARY_UPLOAD_PRESET:it_job}

# Email transport; SMTP credentials are required for email delivery.
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# RabbitMQ publisher confirms / unroutable message returns.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# Email retry and history settings.
email.max-retries=${EMAIL_MAX_RETRIES:3}
email.backoff-base-ms=${EMAIL_BACKOFF_BASE_MS:1000}
email.backoff-max-ms=${EMAIL_BACKOFF_MAX_MS:30000}
email.history.retention-days=${EMAIL_HISTORY_RETENTION_DAYS:180}
email.history.cleanup-cron=${EMAIL_HISTORY_CLEANUP_CRON:0 0 2 * * *}

# Transactional outbox publisher.
outbox.publisher.poll-interval-ms=${OUTBOX_PUBLISHER_POLL_INTERVAL_MS:5000}
outbox.publisher.batch-size=${OUTBOX_PUBLISHER_BATCH_SIZE:10}
outbox.publisher.claim-lease-seconds=${OUTBOX_PUBLISHER_CLAIM_LEASE_SECONDS:120}
outbox.publisher.confirm-timeout-ms=${OUTBOX_PUBLISHER_CONFIRM_TIMEOUT_MS:10000}

# Redis and rate limiting.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.cache.type=redis
spring.cache.redis.key-prefix=itjob:
app.rate-limit.auth.max-requests=${APP_RATE_LIMIT_AUTH_MAX_REQUESTS:10}
app.rate-limit.auth.window-seconds=${APP_RATE_LIMIT_AUTH_WINDOW_SECONDS:60}
app.rate-limit.refresh.max-requests=${APP_RATE_LIMIT_REFRESH_MAX_REQUESTS:30}
app.rate-limit.refresh.window-seconds=${APP_RATE_LIMIT_REFRESH_WINDOW_SECONDS:60}

# S3 credentials are required by S3Config. Bucket and region are deployment settings.
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:itjob-bucket}
aws.s3.region=${AWS_S3_REGION:ap-southeast-1}
aws.s3.access-key=${AWS_S3_ACCESS_KEY}
aws.s3.secret-key=${AWS_S3_SECRET_KEY}

# Kept for compatibility with existing environment configuration; backend code
# currently verifies Google ID tokens without reading this property.
app.google-client-id=${APP_GOOGLE_CLIENT_ID:}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
